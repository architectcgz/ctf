app:
  env: prod
  version: 1.0.0

log:
  level: info
  format: json

postgres:
  username: ctf
  password: change_me
  ssl_mode: require
  max_open_conns: 40
  max_idle_conns: 20
  conn_max_lifetime: 30m

redis:
  mode: single
  password: change_me
  db: 0
  cluster:
    addrs: [] # 仅为未来 cluster 接线预留；当前 redis.mode=cluster 仍会被启动校验拒绝
    route_by_latency: false
    route_randomly: false
  # Sentinel 模式示例：
  # mode: sentinel
  # master_name: mymaster
  # sentinel_addrs:
  #   - 10.0.1.10:26379
  #   - 10.0.1.11:26379
  # sentinel_username: ""
  # sentinel_password: change_me

shared_storage:
  type: shared_fs
  shared_fs:
    # 生产环境应挂载所有 API 副本一致可见的持久化目录。
    root: storage/shared

cors:
  # 生产环境必须显式配置前端 Origin；空数组会在启动校验阶段被拒绝。
  allow_origins: []

auth:
  session_cookie_secure: true

container:
  # 多 API 实例必须使用同一把动态 Flag 密钥；生产环境不会在文件缺失时自动生成。
  # 推荐通过 CTF_CONTAINER_FLAG_GLOBAL_SECRET 注入，或提前把该文件放到所有实例一致可见的持久化位置。
  flag_global_secret_file: runtime/flag-global-secret # 相对 shared_storage.shared_fs.root 解析
  flag_global_secret_key_id: default
  # active key 轮换时，所有 API 副本必须保留仍被实例引用的旧 key；升级前空 flag_key_id 的实例使用 default key。
  flag_global_secret_keyring: []
  flag_global_secret_allow_rotation: false
  # 生产部署时应显式配置可从浏览器访问的主机名或域名，不要依赖默认 localhost
  public_host: ctf.example.com
  # 可选；仅当后端进程与题目发布端口不在同一网络视角时，才需要单独配置内部访问 host。
  access_host: ""
  # 如需开启 AWD 防守 SSH 网关，请配置为可被选手访问的地址和端口。
  defense_ssh_enabled: false
  defense_ssh_host: ctf.example.com # 对外访问地址或 TCP LB 地址；不是 gateway 进程 bind host
  defense_ssh_port: 2222
  # 多 gateway 副本 behind TCP LB 时，所有副本必须挂载同一份预置 host key 文件。
  defense_ssh_host_key_path: runtime/awd-defense-ssh-host-key.pem # 相对 shared_storage.shared_fs.root 解析
  defense_workbench_readonly_enabled: true
  defense_workbench_root: /app
  # 启动判定会在容器创建后探测访问地址，只有探测通过才进入 running
  start_probe_timeout: 800ms
  start_probe_interval: 300ms
  start_probe_attempts: 5
  network:
    single_container_subnet_base: 10.11.0.0/16
    single_container_subnet_mask: 29
    topology_subnet_base: 10.10.0.0/16
    topology_subnet_mask: 24
  registry:
    enabled: false
    scheme: https
    server: "" # 生产环境如需私有仓库，使用 CTF_CONTAINER_REGISTRY_SERVER 注入
    access_server: "" # 可选；仅给后端进程直连 registry API 使用，本地 compose dev 常用 ctf-registry:5000
    username: "" # 使用 CTF_CONTAINER_REGISTRY_USERNAME 注入
    password: "" # 使用 CTF_CONTAINER_REGISTRY_PASSWORD 注入
    identity_token: "" # 可选，使用 CTF_CONTAINER_REGISTRY_IDENTITY_TOKEN 注入
    build_enabled: false
    build_timeout: 10m
    build_concurrency: 1
    default_tag_policy: latest
  scheduler:
    enabled: true
    poll_interval: 1s
    desired_reconcile_interval: 15s
    desired_reconcile_failure_initial_backoff: 30s
    desired_reconcile_failure_max_backoff: 10m
    desired_reconcile_suppress_after_failures: 6
    desired_reconcile_suppress_duration: 30m
    batch_size: 4
    max_concurrent_starts: 4
    max_active_instances: 60
  runtime_node_health:
    enabled: true
    poll_interval: 10s
    probe_timeout: 2s
    stale_after: 30s
    failure_threshold: 3
