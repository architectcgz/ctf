app:
  name: ctf-platform
  env: dev
  version: dev

http:
  host: 0.0.0.0
  port: 8080
  read_timeout: 15s
  write_timeout: 60s
  idle_timeout: 60s

log:
  level: info
  format: json
  output_paths:
    - stdout
  error_output_paths:
    - stderr

postgres:
  host: 127.0.0.1
  port: 5432
  database: ctf
  username: postgres
  password: "" # 通过 CTF_POSTGRES_PASSWORD 注入
  ssl_mode: disable
  max_open_conns: 20
  max_idle_conns: 10
  conn_max_lifetime: 30m

redis:
  mode: single
  addr: 127.0.0.1:6379
  password: "" # 通过 CTF_REDIS_PASSWORD 注入
  db: 2
  cluster:
    addrs: [] # 仅为未来 cluster 接线预留；当前 redis.mode=cluster 仍会被启动校验拒绝
    route_by_latency: false
    route_randomly: false
  master_name: "" # 仅在 sentinel 模式下配置
  sentinel_addrs: [] # 例如 ["10.0.1.10:26379", "10.0.1.11:26379"]
  sentinel_username: "" # 可选；仅在 sentinel 模式且哨兵启用 ACL 时配置
  sentinel_password: "" # 可选；仅在 sentinel 模式下配置
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s

shared_storage:
  type: shared_fs
  shared_fs:
    root: storage/shared

cors:
  allow_origins:
    - http://localhost:5173
    - http://127.0.0.1:5173
  allow_methods:
    - GET
    - POST
    - PUT
    - PATCH
    - DELETE
    - OPTIONS
  allow_headers:
    - Content-Type
    - X-Request-ID
  expose_headers:
    - X-Request-ID
    - X-RateLimit-Limit
    - X-RateLimit-Remaining
    - X-RateLimit-Reset
    - Retry-After
  allow_credentials: true
  max_age: 12h

auth:
  session_ttl: 168h
  session_cookie_name: ctf_session
  session_cookie_path: /api/v1
  session_cookie_secure: false
  session_cookie_http_only: true
  session_cookie_same_site: lax
  session_key_prefix: ctf:auth:session
  cas:
    enabled: false
    base_url: ""
    login_path: /login
    validate_path: /serviceValidate
    service_url: ""
    auto_provision: false

rate_limit:
  redis_key_prefix: ctf:ratelimit
  anonymous:
    enabled: true
    limit: 300
    window: 1m
  global:
    enabled: true
    limit: 600
    window: 1m
  login:
    enabled: true
    limit: 10
    window: 1m
    lock_duration: 15m
  login_ip:
    enabled: true
    limit: 300
    window: 1m
  flag_submit:
    enabled: true
    limit: 5
    window: 1m

container:
  default_cpu_quota: 0.5
  default_memory: 268435456
  default_pids_limit: 100
  readonly_rootfs: false
  run_as_user: ""
  allowed_capabilities:
    - CHOWN
    - SETUID
    - SETGID
  seccomp: default
  port_range_start: 30000
  port_range_end: 40000
  default_exposed_port: 8080
  max_concurrent_per_user: 3
  default_ttl: 2h
  solve_grace_period: 10m
  max_extends: 2
  extend_duration: 1h
  cleanup_interval: "*/5 * * * *"
  cleanup_lock_ttl: 2m
  delete_poll_interval: 1s
  delete_max_concurrent: 8
  orphan_grace_period: 5m
  create_timeout: 60s
  start_probe_timeout: 800ms
  start_probe_interval: 300ms
  start_probe_attempts: 5
  flag_global_secret: "" # 建议通过 CTF_CONTAINER_FLAG_GLOBAL_SECRET 注入
  flag_global_secret_file: runtime/flag-global-secret # 相对 shared_storage.shared_fs.root 解析
  flag_global_secret_key_id: default
  # active key 轮换时保留旧 key；升级前空 flag_key_id 的实例固定使用 default key。
  flag_global_secret_keyring: []
  flag_global_secret_allow_rotation: false
  public_host: localhost
  access_host: "" # 可选；仅给后端进程在容器内探测 / 代理实例使用，本地 compose 可填 host-gateway.internal
  proxy_ticket_ttl: 15m
  proxy_body_preview_size: 1024
  defense_ssh_enabled: false
  defense_ssh_host: 127.0.0.1 # 返回给学生客户端的对外地址；不是 gateway 进程 bind host
  defense_ssh_port: 2222
  defense_ssh_host_key_path: runtime/awd-defense-ssh-host-key.pem # 相对 shared_storage.shared_fs.root 解析；多 gateway 副本时应挂载同一份预置 key 文件
  defense_workbench_readonly_enabled: true
  defense_workbench_root: /app
  network:
    single_container_subnet_base: 10.11.0.0/16
    single_container_subnet_mask: 29
    topology_subnet_base: 10.10.0.0/16
    topology_subnet_mask: 24
  registry:
    enabled: false
    scheme: https
    server: "" # 例如 registry.example.edu 或 registry.local:5000
    access_server: "" # 可选；仅给后端进程直连 registry API 使用，本地 compose 可填 ctf-registry:5000
    username: "" # 建议通过 CTF_CONTAINER_REGISTRY_USERNAME 注入
    password: "" # 建议通过 CTF_CONTAINER_REGISTRY_PASSWORD 注入
    identity_token: "" # 可选，使用 token 认证时通过 CTF_CONTAINER_REGISTRY_IDENTITY_TOKEN 注入
    build_enabled: false
    build_timeout: 10m
    build_concurrency: 1
    default_tag_policy: latest
  scheduler:
    enabled: true
    poll_interval: 1s
    desired_reconcile_interval: 15s
    desired_reconcile_failure_initial_backoff: 30s
    desired_reconcile_failure_max_backoff: 10m
    desired_reconcile_suppress_after_failures: 6
    desired_reconcile_suppress_duration: 30m
    batch_size: 4
    max_concurrent_starts: 4
    max_active_instances: 60

pagination:
  default_page_size: 20
  max_page_size: 100

challenge:
  solved_count_cache_ttl: 5m
  publish_check:
    enabled: true
    poll_interval: 2s
    batch_size: 1

score:
  cache_ttl: 5m
  lock_timeout: 5s
  max_ranking_limit: 100

cache:
  progress_ttl: 10m

assessment:
  redis_key_prefix: ctf:assessment:skill-profile
  full_rebuild_cron: "0 0 * * *"
  full_rebuild_timeout: 30m
  lock_ttl: 10s
  incremental_update_delay: 100ms
  incremental_update_timeout: 5s

recommendation:
  weak_threshold: 0.4
  cache_ttl: 1h
  default_limit: 6
  max_limit: 20

report:
  storage_dir: storage/exports
  default_format: pdf
  personal_timeout: 30s
  class_timeout: 2m
  file_ttl: 168h
  max_workers: 2

dashboard:
  cache_ttl: 30s
  alert_threshold: 80
  redis_key_prefix: ctf:dashboard

websocket:
  ticket_ttl: 30s
  ticket_key_prefix: ctf:ws:ticket
  heartbeat_interval: 30s
  read_timeout: 75s
  retry_initial_delay: 1s
  retry_max_delay: 30s

runtime_agent:
  enabled: false
  endpoint: ""
  dial_timeout: 5s
  server_name: ""
  ca_file: ""
  cert_file: ""
  key_file: ""
  server:
    enabled: false
    host: 0.0.0.0
    port: 9443
    cert_file: ""
    key_file: ""
    client_ca_file: ""
    shutdown_timeout: 10s

contest:
  status_update_interval: 1m
  status_update_batch_size: 1000
  status_update_lock_ttl: 30s
  base_score: 1000
  min_score: 100
  decay: 0.9
  first_blood_bonus: 0.1
  awd:
    scheduler_interval: 30s
    scheduler_lock_ttl: 30s
    scheduler_batch_size: 200
    round_interval: 5m
    round_lock_ttl: 30s
    previous_round_grace: 30s
    checker_timeout: 3s
    checker_health_path: /health
    checker_sandbox:
      image: python:3.12-alpine
      user: "65532:65532"
      work_dir: /checker
      timeout: 10s
      cpu_quota: 0.5
      memory_bytes: 134217728
      pids_limit: 64
      nofile_limit: 128
      output_limit_bytes: 32768
      # 默认关闭网络；script_checker 接入目标服务时必须由平台显式传入受控 network_mode。
      network_mode: ""
